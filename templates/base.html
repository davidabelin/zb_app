<!DOCTYPE html>
<html lang="en">
<head>
    <!--
      Shared base template for the browser-facing web shell.
      It injects runtime session options and loads the common stylesheet/script
      assets used by chatter, koan pages, and admin views.
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script>window.PUBLIC_SESSION_OPTIONS = {{ public_session_options|tojson }};</script>
    <script src="{{ url_for('static', filename='scripts.js') }}"></script>
    <!-- Included for display at chatter.html: Marked.js from a CDN-->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <title>{% block title %}Zenbot Dokusan{% endblock %}</title>
</head>
<body>
    <div id="spinnerContainer" style="position: relative;"></div>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <footer>
        {% block footer %}{% endblock %}
        <ul>
            <li><a href="{{ url_for('home') }}">Back to the Entrance Hall</a></li>
            <li><a href="{{ url_for('chatter') }}">Enter the Sanzen Room</a></li>
            <li><a href="{{ url_for('gg') }}"><i>Gateless Gate</i> Commentaries</a></li>
            <li><a href="{{ url_for('display_pdf') }}"><i>Blue Cliff Record</i> Materials</a></li>
            <li><a href="{{ url_for('legacy_splash') }}">Legacy Splash</a></li>
            <li><a href="https://chatgpt.com/g/g-9w9FN2RE6-zenbot">Chat with the 'Zen Guidebot' at ChatGPT.com</a></li>
        </ul>
        <i>ZenbotDokusan &copy; 2026</i>
    </footer>
</body>
</html>
